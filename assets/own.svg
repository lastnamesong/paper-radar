<svg xmlns="http://www.w3.org/2000/svg" width="880" height="204" viewBox="0 0 880 204" role="img" aria-label="Who writes what: you write context/, and paper-radar reads it and writes scouting/, analysis/ and comparison/. Changes to context/ come to you as proposals.">
  <style>
    .tx-rest  { fill: #13283F; opacity: .28; }
    .tx-halo  { fill: #C27C0E; opacity: .42; }
    .tx-core  { fill: #C27C0E; }
    .lens     { fill: none; stroke: #13283F; stroke-width: 2.4; stroke-linecap: round; }
    .person   { fill: #5B6B7C; }

    .mine  { fill: #FBFCFD; stroke: #13283F; stroke-width: 1.2; }
    .matte { fill: none; stroke: #E5EAF0; stroke-width: 1; }
    .row   { fill: #FBFCFD; stroke: #D3DBE3; stroke-width: 1.2; }
    .eb    { fill: #5B6B7C; font: 600 11px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .p     { fill: #13283F; font: 700 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .ps    { fill: #5B6B7C; font: 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .note  { fill: #5B6B7C; font: 12.5px system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .wire  { fill: none; stroke: #13283F; stroke-width: 1.4; stroke-dasharray: 4 5; }
    .head  { fill: #13283F; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<g transform="translate(37.0 0)"><text class="eb" x="116" y="42">You write</text>
  <g transform="translate(20 64.0) scale(0.8)"><circle class="person" cx="48" cy="33" r="14.5"/><path class="person" d="M21 76 a27 27 0 0 1 54 0 Z"/></g>
  <rect class="mine" x="116" y="52" width="196" height="112" rx="6"/>
  <rect class="matte" x="121" y="57" width="186" height="102" rx="4"/>
  <text class="p" x="136" y="96.0">context/</text>
  <text class="ps" x="136" y="118.0">MASTER.md</text>
  <text class="ps" x="136" y="136.0">P#.md, one per research area</text>
  <path class="wire" d="M332 108.0 H394"/><path class="head" d="M402 108.0 l-8 -4.5 v9 Z"/>
  <text class="note" x="367.0" y="98.0" text-anchor="middle">reads</text>
  <circle class="tx-rest" cx="425.0" cy="81.0" r="3.2"/><circle class="tx-halo" cx="443.0" cy="81.0" r="5.6"/><circle class="tx-halo" cx="461.0" cy="81.0" r="5.6"/><circle class="tx-rest" cx="479.0" cy="81.0" r="3.2"/><circle class="tx-halo" cx="425.0" cy="99.0" r="5.6"/><circle class="tx-core" cx="443.0" cy="99.0" r="7.7"/><circle class="tx-core" cx="461.0" cy="99.0" r="7.7"/><circle class="tx-halo" cx="479.0" cy="99.0" r="5.6"/><circle class="tx-halo" cx="425.0" cy="117.0" r="5.6"/><circle class="tx-core" cx="443.0" cy="117.0" r="7.7"/><circle class="tx-core" cx="461.0" cy="117.0" r="7.7"/><circle class="tx-halo" cx="479.0" cy="117.0" r="5.6"/><circle class="tx-rest" cx="425.0" cy="135.0" r="3.2"/><circle class="tx-halo" cx="443.0" cy="135.0" r="5.6"/><circle class="tx-halo" cx="461.0" cy="135.0" r="5.6"/><circle class="tx-rest" cx="479.0" cy="135.0" r="3.2"/>
  <text class="eb" x="524" y="42">paper-radar writes</text>
  <rect class="mine" x="524" y="52" width="262" height="112" rx="6"/>
  <rect class="row" x="533" y="72.5" width="244" height="21" rx="3"/>
  <text class="p" x="544" y="87.5">scouting/</text>
  <text class="ps" x="766" y="87.5" text-anchor="end">Wed and Sat</text>
  <rect class="row" x="533" y="97.5" width="244" height="21" rx="3"/>
  <text class="p" x="544" y="112.5">analysis/</text>
  <text class="ps" x="766" y="112.5" text-anchor="end">on request</text>
  <rect class="row" x="533" y="122.5" width="244" height="21" rx="3"/>
  <text class="p" x="544" y="137.5">comparison/</text>
  <text class="ps" x="766" y="137.5" text-anchor="end">on request</text>
  <text class="note" x="403.0" y="190" text-anchor="middle">It reads context/ and never writes it. Changes come to you as proposals.</text></g>
</svg>
