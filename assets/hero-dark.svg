  <circle class="tx-core pk0" style="transform-box: fill-box; transform-origin: center" cx="560" cy="96" r="9.0"/><circle class="tx-core pk1" style="transform-box: fill-box; transform-origin: center" cx="620" cy="186" r="9.0"/><circle class="tx-core pk2" style="transform-box: fill-box; transform-origin: center" cx="710" cy="126" r="9.0"/><circle class="tx-core pk3" style="transform-box: fill-box; transform-origin: center" cx="800" cy="156" r="9.0"/>
