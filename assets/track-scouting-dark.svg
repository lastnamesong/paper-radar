<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="scouting: a sweep across the grid">
  <style>
    .tx-rest  { fill: #E6ECF2; opacity: .28; }
    .tx-halo  { fill: #E3A23B; opacity: .42; }
    .tx-core  { fill: #E3A23B; }
    .lens     { fill: none; stroke: #E6ECF2; stroke-width: 2.4; stroke-linecap: round; }
    .person   { fill: #93A3B4; }

    .sweep { animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(36px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<rect class="tx-halo sweep" x="6" y="8" width="52" height="12" rx="6"/><circle class="tx-rest" cx="14.0" cy="14.0" r="2.2"/><circle class="tx-rest" cx="26.0" cy="14.0" r="2.2"/><circle class="tx-rest" cx="38.0" cy="14.0" r="2.2"/><circle class="tx-rest" cx="50.0" cy="14.0" r="2.2"/><circle class="tx-rest" cx="14.0" cy="26.0" r="2.2"/><circle class="tx-rest" cx="26.0" cy="26.0" r="2.2"/><circle class="tx-rest" cx="38.0" cy="26.0" r="2.2"/><circle class="tx-rest" cx="50.0" cy="26.0" r="2.2"/><circle class="tx-rest" cx="14.0" cy="38.0" r="2.2"/><circle class="tx-rest" cx="26.0" cy="38.0" r="2.2"/><circle class="tx-rest" cx="38.0" cy="38.0" r="2.2"/><circle class="tx-rest" cx="50.0" cy="38.0" r="2.2"/><circle class="tx-rest" cx="14.0" cy="50.0" r="2.2"/><circle class="tx-rest" cx="26.0" cy="50.0" r="2.2"/><circle class="tx-rest" cx="38.0" cy="50.0" r="2.2"/><circle class="tx-rest" cx="50.0" cy="50.0" r="2.2"/>
</svg>
