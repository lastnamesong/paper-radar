<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The paper-radar mark as a tab icon: `components.mark()`'s taxel grid at
       a third of its geometry, with the rest taxels dropped — at 16 px only
       the pressed patch survives, and a grid of specks reads as noise.

       The colours are the signal and ink tokens of `site.css` resolved to
       sRGB. A favicon is fetched outside the page, so it cannot read a custom
       property and carries its own `prefers-color-scheme` rule instead. -->
  <style>
    .core { fill: #d79127; }
    .halo { fill: #d79127; opacity: .5; }
    @media (prefers-color-scheme: dark) {
      .core, .halo { fill: #eaac48; }
    }
  </style>
  <circle class="halo" cx="12" cy="4" r="2.4"/><circle class="halo" cx="20" cy="4" r="2.4"/>
  <circle class="halo" cx="4" cy="12" r="2.4"/><circle class="core" cx="12" cy="12" r="3.4"/>
  <circle class="core" cx="20" cy="12" r="3.4"/><circle class="halo" cx="28" cy="12" r="2.4"/>
  <circle class="halo" cx="4" cy="20" r="2.4"/><circle class="core" cx="12" cy="20" r="3.4"/>
  <circle class="core" cx="20" cy="20" r="3.4"/><circle class="halo" cx="28" cy="20" r="2.4"/>
  <circle class="halo" cx="12" cy="28" r="2.4"/><circle class="halo" cx="20" cy="28" r="2.4"/>
</svg>
